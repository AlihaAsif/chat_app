name: chat_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  fllama:
    git:
      url: https://github.com/Telosnex/fllama.git
      ref: main
  path_provider: ^2.1.4
  http: ^1.2.2


  # State management
  provider: ^6.1.2

  # Utils
  intl: ^0.19.0
  cached_network_image: ^3.4.1
  supabase_flutter: ^2.16.0
  path: ^1.9.1
  image_picker: ^1.2.2
  file_picker: ^8.1.2
  url_launcher: ^6.3.2
  record: ^6.2.1
  audioplayers: ^6.7.1

# fllama ke liye Android NDK ka path directly batana (auto-detect Windows pe fail ho raha tha)
hooks:
  user_defines:
    fllama:
      android:
        android_home: "D:/androidsdk"
        ndk_version: "27.0.12077973"

dev_dependencies:
  flutter_test:
    sdk: flutter

  # The "flutter_lints" package below contains a set of recommended lints to
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:

  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # App assets (icon, images etc.)
  assets:
    - assets/icon/app_icon.png

# Launcher icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/app_icon.png"

# Native splash screen configuration
flutter_native_splash:
  color: "#FFFFFF"
  image: assets/icon/app_icon.png
  android_12:
    color: "#FFFFFF"
    image: assets/icon/app_icon.png
  android_gravity: center
  ios_content_mode: center